# Üretim kurulumu: docker compose up -d   (ilk kurulumda: docker compose run --rm seed)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: binkilic
      POSTGRES_USER: binkilic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binkilic -d binkilic"]
      interval: 10s
      retries: 10

  app:
    build: { context: ., target: runner, args: { APP_URL: "${APP_URL:?APP_URL gerekli}" } }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://binkilic:${POSTGRES_PASSWORD}@db:5432/binkilic?schema=public
      UPLOAD_DIR: /app/storage/uploads
    volumes: [uploads:/app/storage/uploads]
    depends_on: { db: { condition: service_healthy } }
    expose: ["3000"]

  # İlk kurulum: roller, admin kullanıcısı, örnek menü ve görseller
  seed:
    build: { context: ., target: tools }
    profiles: [setup]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://binkilic:${POSTGRES_PASSWORD}@db:5432/binkilic?schema=public
      UPLOAD_DIR: /app/storage/uploads
    volumes: [uploads:/app/storage/uploads]
    depends_on: { db: { condition: service_healthy } }
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"

  # Otomatik HTTPS (Let's Encrypt) + HTTP/2/3, sıkıştırma
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { DOMAIN: "${DOMAIN:?DOMAIN gerekli}" }
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: [app]

  # Her gece 03:30'da veritabanı + medya yedeği (14 gün saklanır)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://binkilic:${POSTGRES_PASSWORD}@db:5432/binkilic
      BACKUP_DIR: /backups
      UPLOAD_DIR: /uploads
      BACKUP_KEEP_DAYS: "14"
    volumes: ["./storage/backups:/backups", "uploads:/uploads:ro", "./scripts:/scripts:ro"]
    entrypoint: ["sh", "-c", "echo '30 3 * * * /scripts/backup.sh >> /backups/backup.log 2>&1' | crontab - && crond -f -l 8"]
    depends_on: { db: { condition: service_healthy } }

volumes: { pgdata: {}, uploads: {}, caddy_data: {}, caddy_config: {} }
